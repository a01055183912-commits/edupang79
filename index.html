<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정책사업 학습">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>정책사업 학습·준비 도구</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand"><img class="mascot" src="icons/icon.svg" alt="" width="60" height="60"><h1>정책사업 학습·준비 도구</h1></div>
  <p>에듀팡파트너즈 수강생용 · 내 상황 정리 → 공부 → 공고 찾기까지. 입력한 내용은 이 기기의 브라우저에만 저장됩니다.</p>
  <div class="tiles" id="tiles"></div>
</div></header>
<nav class="tabs" aria-label="메뉴"><div class="in" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="study-data.js"></script>
<script src="pack.js"></script>
<script>
'use strict';
/* ===== 상태 ===== */
const KEY='edupang-learn-v1',OLD='edupang-policy-v1';
const STATUS=['검토','준비중','제출','선정','탈락','보류'];
const SITES=[['소상공인지원센터','https://bsbsc.kr/posting'],['테크노파크','https://www.btp.or.kr/kor/CMS/Board/Board.do?mCode=MN013&mgr_seq=16'],['기술창업투자원','https://www.bsia.or.kr/board?mcode=an021'],['정보산업진흥원','https://bipa.kr/board/business/list'],['창조경제혁신센터','https://ccei.creativekorea.or.kr/busan/service/program_list.do?&page=1'],['경제진흥원','https://www.bepa.kr/'],['관광기업지원센터','https://tourbiz.bto.or.kr/kor/CMS/Board/Board.do?mCode=MN032&mgr_seq=6'],['디자인진흥원','https://dcb.or.kr/01_news/?mcode=0401010000']];
const UNITS=CATALOG.flatMap(c=>c.mods.map(m=>({...m,cid:c.id})));
const fresh=()=>({v:1,me:{form:'',hasBiz:'',openDate:'',bizType:'',age:'',region:'',selfFund:'',prior:''},done:{},notices:[],guide:{checks:{}},badges:{}});
let S=load();
function load(){const b=fresh();try{const r=localStorage.getItem(KEY);if(r)return merge(b,JSON.parse(r));
 const o=localStorage.getItem(OLD);if(o){const j=JSON.parse(o);if(j){if(Array.isArray(j.notices))b.notices=j.notices.filter(x=>x&&typeof x==='object');if(j.guide)merge(b,{guide:j.guide})}}}catch(e){}return b}
function merge(b,s){if(!s||typeof s!=='object')return b;
 if(s.me&&typeof s.me==='object')for(const f of Object.keys(b.me))if(f in s.me&&(typeof s.me[f]==='string'||typeof s.me[f]==='number'))b.me[f]=s.me[f];
 if(s.done&&typeof s.done==='object')for(const [k,v] of Object.entries(s.done))if(v===true&&UNITS.some(u=>u.id===k))b.done[k]=true;
 if(Array.isArray(s.notices))b.notices=s.notices.filter(x=>x&&typeof x==='object');
 if(s.guide&&s.guide.checks&&typeof s.guide.checks==='object')for(const [k,v] of Object.entries(s.guide.checks))if(v===true&&GUIDE.checks.some(c=>c[0]===k))b.guide.checks[k]=true;
 if(s.badges&&typeof s.badges==='object')for(const [k,v] of Object.entries(s.badges))if(v===true&&/^b\d{1,2}$/.test(k))b.badges[k]=true;
 return b}
let failed=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!failed){failed=true;toast('브라우저 저장이 막혀 있습니다. 「설정」 탭에서 백업 파일을 받아 두세요.')}}}

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800)}
Pack.onMsg=toast;
function setPath(o,p,v){const k=p.split('.');if(k.some(x=>x==='__proto__'||x==='constructor'||x==='prototype'))return;let c=o;for(let i=0;i<k.length-1;i++){if(c[k[i]]==null||typeof c[k[i]]!=='object')c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=v}
const bind=(p,v,x='')=>`data-bind="${esc(p)}" value="${esc(v)}" ${x}`;
function dday(s){if(!s)return null;const d=new Date(s+'T00:00:00');if(isNaN(d))return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function dd(s){const d=dday(s);if(d==null)return`<div class="dd gray"><small>🫧 마감</small><b>미정</b></div>`;if(d<0)return`<div class="dd gray"><small>💤 마감</small><b>지남</b></div>`;
 return`<div class="dd ${d<=3?'red':d<=14?'amber':''}"><small>${d===0?'🚨 오늘':d<=3?'🔥 D-day':d<=14?'⏰ D-day':'📅 D-day'}</small><b>${d===0?'마감':'D-'+d}</b></div>`}
const STE={검토:'👀',준비중:'✍️',제출:'📨',선정:'🎉',탈락:'💧',보류:'⏸️'};
function tenure(){const d=new Date(S.me.openDate+'T00:00:00');if(!S.me.openDate||isNaN(d))return'';const t=new Date();let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth();if(t.getDate()<d.getDate())m--;return m<0?'':`${Math.floor(m/12)}년 ${m%12}개월`}
const progress=()=>{const n=UNITS.filter(u=>S.done[u.id]).length;return{n,total:UNITS.length,pct:Math.round(n/UNITS.length*100)}};

/* ===== 배지 ===== */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const studyState=()=>{try{return JSON.parse(lsGet('edupang-study-v1')||'null')||{}}catch(e){return{}}};
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const BADGES=[
 ['b1','🐣','첫걸음','내 좌표를 하나 입력했어요',()=>Object.values(S.me).some(v=>v!==''&&v!=null)],
 ['b2','🌱','새싹 학습자','학습 단원을 1개 마쳤어요',()=>Object.keys(S.done).length>=1],
 ['b3','📘','입문 완주','입문과정 4단원을 모두 마쳤어요',()=>CATALOG[0].mods.every(m=>S.done[m.id])],
 ['b4','🔔','공고 탐정','관심 공고를 등록했어요',()=>S.notices.length>=1],
 ['b5','📌','마감 지킴이','마감일을 적은 관심 공고가 있어요',()=>S.notices.some(n=>n.deadline)],
 ['b6','✅','체크의 달인','공고 확인 체크리스트를 모두 체크했어요',()=>GUIDE.checks.every(c=>S.guide.checks[c[0]])],
 ['b7','⚖️','사후관리 완주','사후관리 레슨 11개를 모두 마쳤어요',()=>LESSONS.every(l=>(studyState().done||{})[l.id])],
 ['b8','🎯','퀴즈 80점','퀴즈 전체에서 80점을 넘었어요',()=>(studyState().best??0)>=80],
 ['b9','🏆','퀴즈 만점','퀴즈 전체에서 100점을 받았어요',()=>studyState().best===100],
 ['b10','💬','Claude 친구','학습자료를 내려받았어요',()=>lsGet('edupang-pack-dl')==='1'],
 ['b11','📲','앱 사용자','홈 화면 앱으로 열었어요',()=>standalone()]];
let POP='';
function checkBadges(){const got=BADGES.filter(b=>{try{return b[4]()}catch(e){return false}}).map(b=>b[0]),fresh2=got.filter(id=>!S.badges[id]);
 if(fresh2.length){fresh2.forEach(id=>S.badges[id]=true);save();POP=fresh2[0];const b=BADGES.find(x=>x[0]===fresh2[0]);toast(`🎉 새 배지! ${b[1]} ${b[2]}${fresh2.length>1?' 외 '+(fresh2.length-1)+'개':''}`)}}
let DEFERRED=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(tab==='data')render()});
function installCard(){if(standalone())return`<div class="card"><h2>📲 앱으로 보고 있어요</h2><p style="margin:4px 0 0">홈 화면 앱으로 실행 중입니다 🎉</p></div>`;
 return`<div class="card" style="background:linear-gradient(135deg,var(--pri-soft),var(--violet-soft))"><h2>📲 앱처럼 설치하기</h2><p style="margin:4px 0 10px">홈 화면에 추가하면 앱처럼 전체 화면으로 열리고, 한 번 열어 본 화면은 인터넷이 없어도 볼 수 있어요.</p>
 ${DEFERRED?'<button class="btn pri" data-act="install" style="margin-bottom:8px">📲 앱 설치하기</button>':''}
 <div class="fc"><b>🍎 아이폰 (Safari)</b><p style="margin:2px 0 0">아래 가운데 <b>공유 버튼(□↑)</b> → <b>「홈 화면에 추가」</b> → 추가</p></div>
 <div class="fc"><b>🤖 안드로이드 (Chrome)</b><p style="margin:2px 0 0">오른쪽 위 <b>⋮ 메뉴</b> → <b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b></p></div>
 <p class="hint" style="margin-bottom:0">카카오톡 등 앱 안에서 연 화면에서는 설치 메뉴가 안 보일 수 있어요. 그럴 땐 Safari나 Chrome으로 열어 주세요.</p></div>`}
function badgeCard(){const n=BADGES.filter(b=>S.badges[b[0]]).length;
 return`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🏅 내 배지</h2><span class="chip warn">${n}/${BADGES.length} 획득</span></div>
 <p class="hint">공부하고 준비할 때마다 배지가 생겨요. 회색 배지는 아직 도전 중이에요!</p>
 <div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges[b[0]]?'':'lock'} ${POP===b[0]?'pop':''}"><span class="e" aria-hidden="true">${b[1]}</span><b>${esc(b[2])}</b><small>${esc(b[3])}</small></div>`).join('')}</div></div>`}

/* ===== 공고 데이터 ===== */
let FEED=null,FEEDERR='',FEEDQ='';
fetch('data/notices.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{FEED=j;live()}).catch(()=>{FEEDERR='수집된 공고를 불러오지 못했습니다. 웹 주소(GitHub Pages)로 열었을 때만 보입니다.';live()});

/* ===== 화면 ===== */
const TABS=[['me','🐣','내 정보'],['course','🦉','학습'],['notice','🔔','공고'],['guide','🗺️','가이드'],['ask','✨','Claude'],['data','🎒','설정']];
let tab=(location.hash||'#me').slice(1);if(!TABS.some(t=>t[0]===tab))tab='me';

const F={
me(){const M=S.me;return`
 ${badgeCard()}
 ${!standalone()&&lsGet('edupang-install-dismissed')!=='1'?`<div class="card" style="background:var(--pri-soft)"><b>📲 홈 화면에 추가하면 앱처럼 쓸 수 있어요</b><div class="row mt"><button class="btn sm pri" data-go="data">설치 방법 보기</button><button class="btn sm" data-act="dismissInstall">닫기</button></div></div>`:''}
 <div class="card"><h2>🐣 나의 좌표</h2><p class="hint">공고를 검색하기 전에 먼저 채우세요. 교안의 「신청 전 나의 좌표 확정」 체크리스트입니다. 이 기기에만 저장됩니다.</p>
 <div class="grid mt">
  <label>사업 형태<select data-bind="me.form"><option value="">선택</option>${['예비창업자','프리랜서(3.3%)','개인사업자','법인사업자'].map(x=>`<option ${M.form===x?'selected':''}>${x}</option>`).join('')}</select></label>
  <label>사업자등록<select data-bind="me.hasBiz"><option value="">선택</option>${['있음','없음'].map(x=>`<option ${M.hasBiz===x?'selected':''}>${x}</option>`).join('')}</select><span class="hint">확인: 홈택스 사업자등록 상태</span></label>
  <label>개업 연월일<input type="date" ${bind('me.openDate',M.openDate)}><span class="hint">확인: 사업자등록증 개업 연월일</span></label>
  <label>연령(만 나이)<input type="number" inputmode="numeric" min="0" ${bind('me.age',M.age)}></label>
  <label>거주지·사업장 소재지<input ${bind('me.region',M.region,'placeholder="예: 부산 북구"')}><span class="hint">확인: 주민등록등본·사업자등록증</span></label>
  <label>업종 (업태·종목)<input ${bind('me.bizType',M.bizType)}><span class="hint">확인: 홈택스 업태·종목</span></label>
  <label>자부담 가용 금액(원)<input type="number" inputmode="numeric" min="0" ${bind('me.selfFund',M.selfFund)}><span class="hint">정직하게 적으세요</span></label>
 </div>
 <label class="mt">기존 수혜 이력<textarea data-bind="me.prior" placeholder="받은 지원사업이 있으면 사업명·연도를 적으세요. (K-Startup에서 확인)">${esc(M.prior)}</textarea></label></div>
 <div class="card"><h2>🔎 내 좌표 요약</h2><div data-live="me"></div></div>
 <div class="card"><h2>다음 단계</h2><div class="row"><button class="btn pri" data-go="notice">📢 공고 보러 가기</button><button class="btn" data-go="guide">💡 공고 읽는 법</button></div></div>`},

course(){const P=progress();return`
 <div class="card"><div class="row" style="flex-wrap:nowrap"><div class="ring" style="--p:${P.pct}"><i>${P.pct}%</i></div>
 <div><h2>📚 내 학습 진도</h2><p style="margin:0">${P.n} / ${P.total}개 단원 완료</p><p class="hint" style="margin:2px 0 0">단원을 공부했으면 눌러서 체크하세요.</p></div></div></div>
 <div class="card" style="background:linear-gradient(135deg,var(--violet-soft),var(--pri-soft))"><h2>⚖️ 정부지원금 사후관리 학습</h2><p style="margin:4px 0 10px">받은 뒤 지키는 법: 환수·참여제한·불복. 레슨, 퀴즈 45문항, 통보서 판별, 10계명, 판례 색인이 있습니다.</p><a class="btn pri" href="study.html">학습 시작하기 →</a></div>
 ${CATALOG.map((c,ci)=>{const on=c.mods.filter(m=>S.done[m.id]).length,pct=Math.round(on/c.mods.length*100),h=c.mods.reduce((a,m)=>a+m.h,0);
 return`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${['①','②','③','④'][ci]} ${esc(c.name)}</h2><span class="chip vio">${h}시간${c.mods.some(m=>m.est)?' (일부 추정)':''}</span></div>
 <p class="hint" style="margin:2px 0 8px">${esc(c.title)}</p><div class="bar ${on===c.mods.length?'teal':''}" aria-label="${esc(c.name)} 진도"><i style="width:${pct}%"></i></div><p class="hint" style="margin:4px 0 6px">${on}/${c.mods.length} 완료</p>
 ${c.mods.map(m=>`<label class="item ${S.done[m.id]?'on':''}"><input type="checkbox" data-done="${m.id}" ${S.done[m.id]?'checked':''}><span class="t"><b>${m.id}</b> ${esc(m.t)}<small>${m.est?'':m.h+'시간 · '}${esc(m.k||'')}${m.goal?' · 목표: '+esc(m.goal):''}${m.out?'<br>산출물: '+esc(m.out):''}</small></span></label>`).join('')}
 <p class="hint" style="margin-bottom:0">대표 산출물: ${esc(c.out)}</p></div>`}).join('')}`},

notice(){const items=S.notices.map((x,n)=>({x,n})).sort((a,b)=>(a.x.deadline||'9999')<(b.x.deadline||'9999')?-1:1);return`
 <div class="card"><h2>📢 새로 수집된 공고</h2><p class="hint">부산 지원기관 8곳 중 7곳의 접수 중 공고를 매일 아침 7시에 자동 수집합니다. 접수 기한과 자격은 반드시 공고문에서 확인하세요.</p>
 <div data-live="feedstat"></div>
 <label class="mt">검색<input data-feedq placeholder="제목·기관 (예: 교육, 창업)" value="${esc(FEEDQ)}"></label>
 <div class="mt" data-live="feed"></div></div>
 <div class="card"><h2>🔗 기관 사이트 바로가기</h2><p class="hint">공고 게시판으로 이동합니다. (새 창)</p>
 <div class="row">${SITES.map(x=>`<a class="btn sm" href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${esc(x[0])}</a>`).join('')}</div></div>
 <div class="card"><h2>⭐ 내 공고 관리</h2><p class="hint">관심 있는 공고를 모아 마감일과 준비 상태를 관리합니다. 경제진흥원 공고는 직접 추가하세요.</p>
 ${items.map(({x,n})=>`<div class="card" style="box-shadow:none;margin-bottom:10px"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${dd(x.deadline)}<div style="flex:1;min-width:0"><span class="chip">${STE[x.status||'검토']||''} ${esc(x.status||'검토')}</span>${x.agency?`<span class="chip vio">${esc(x.agency)}</span>`:''}</div></div>
  <div class="grid mt"><label>공고명<input ${bind(`notices.${n}.title`,x.title)}></label><label>기관<input ${bind(`notices.${n}.agency`,x.agency)}></label>
  <label>마감일<input type="date" data-rerender ${bind(`notices.${n}.deadline`,x.deadline)}></label>
  <label>상태<select data-bind="notices.${n}.status" data-rerender>${STATUS.map(s=>`<option ${s===(x.status||'검토')?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <label class="mt">링크<input ${bind(`notices.${n}.url`,x.url,'placeholder="https://"')}></label>${/^https?:\/\//.test(x.url||'')?`<p style="margin:6px 0"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">공고 열기 ↗</a></p>`:''}
  <label class="mt">메모<input ${bind(`notices.${n}.memo`,x.memo,'placeholder="지원 규모·자격 요건 등"')}></label>
  <div class="mt"><button class="btn sm del" data-act="delNotice:${n}">삭제</button></div></div>`).join('')||'<p class="hint">등록된 공고가 없습니다.</p>'}
 <button class="btn pri" data-act="addNotice">＋ 공고 직접 추가</button></div>`},

guide(){const C=S.guide.checks,n=GUIDE.checks.filter(c=>C[c[0]]).length;return`
 <div class="card"><h2>💡 정책사업, 이렇게 읽습니다</h2>
 <div class="flow"><div class="s s1">① 운영지침<small>자격·사업비·정산 기준</small></div><div class="a">→</div><div class="s s2">② 공고문<small>올해 모집 내용</small></div><div class="a">→</div><div class="s s3">③ 신청 양식<small>사업계획서 등</small></div></div>
 <ul>${GUIDE.flow.slice(1).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <p class="hint">교안 참고: 입문 1-2 「시행지침」, 「공고문과 양식은 이렇게 생겼다」</p></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">✅ 공고 볼 때 확인할 것</h2><span class="chip ${n===GUIDE.checks.length?'ok':''}">${n}/${GUIDE.checks.length}</span></div>
 <p class="hint">공고 하나를 열어 놓고 하나씩 체크해 보세요. 변호사 강의 교안은 「지원제외 대상」을 가장 먼저 읽으라고 합니다.</p>
 ${GUIDE.checks.map(c=>`<label class="item ${C[c[0]]?'on':''}"><input type="checkbox" data-gcheck="${c[0]}" ${C[c[0]]?'checked':''}><span class="t"><b>${esc(c[1])}</b><small>${esc(c[2])}</small></span></label>`).join('')}
 <div class="row mt"><button class="btn sm" data-act="clearChecks">체크 모두 해제</button><button class="btn sm" data-go="notice">공고 목록으로</button></div></div>
 <div class="card"><h2>📄 제출 서류</h2>${GUIDE.docs.map(d=>`<div class="fc"><b>${esc(d[0])}</b> <span class="chip">${esc(d[1])}</span><p class="hint" style="margin:4px 0 0">${esc(d[2])}</p></div>`).join('')}</div>
 <div class="card"><h2>🗂️ 신청 전에 갖춰 둘 정보</h2>${GUIDE.info.map(d=>`<div class="fc"><b>${esc(d[0])}</b><p style="margin:2px 0">${esc(d[1])}</p><span class="chip vio">${esc(d[2])}</span></div>`).join('')}</div>
 <div class="card"><h2>🎯 왜 사업주 정보가 정책사업에 필요할까?</h2>
 <p>정책사업은 공고문의 <b>지원 자격, 제외 대상, 평가 방법, 제출 서류</b>로 신청자의 준비 상태를 확인합니다(교안 슬라이드 35). 입문 과정의 정보는 그 항목들에 답하기 위한 기초입니다.</p>
 ${GUIDE.why.map(w=>`<details class="acc"><summary>${esc(w[0])}</summary><div class="body"><p><span class="chip">쓰이는 곳</span> ${esc(w[1])}</p><p><span class="chip warn">왜 필요한가</span> ${esc(w[2])}</p></div></details>`).join('')}
 <p class="hint" style="margin-bottom:0">교안의 설명과 일반적인 지원사업 공고 구성을 연결한 안내입니다. 실제 요건은 각 공고문과 운영지침이 우선합니다.</p></div>
 <div class="card"><h2>⚖️ 더 깊이 공부하기</h2><p>받은 뒤 지키는 법(환수·참여제한·불복)은 학습 페이지에서 레슨과 퀴즈로 공부하세요.</p><a class="btn pri" href="study.html">사후관리 학습 →</a></div>`},

ask(){return Pack.cardHtml({withMe:true})},

data(){return`
 ${installCard()}
 <div class="card"><h2>💾 백업·복원</h2><p class="hint">데이터는 이 기기의 브라우저에만 있습니다. 브라우저 기록을 지우거나 다른 기기에서 쓰려면 백업 파일을 받아 두세요.</p>
 <div class="row"><button class="btn pri" data-act="backup">백업 파일 받기</button><label class="btn" style="margin:0">복원하기<input type="file" id="restore" accept=".json" hidden></label></div></div>
 <div class="card"><h2>🗑️ 초기화</h2><p class="hint">내 정보, 진도, 공고를 모두 지웁니다. 되돌릴 수 없으니 먼저 백업하세요.</p><button class="btn del" data-act="reset">전체 초기화</button></div>`}
};

const LIVE={
 me(){const M=S.me,t=tenure(),tips=[];
  if(t)tips.push(['ok',`업력 <b>${t}</b> — 업력의 기산점은 「사업개시일」, 종점은 「신청서 제출일」입니다(중진공 정책자금). 신청을 미루면 업력이 늘어 자격에서 빠질 수 있습니다.`]);
  if(M.form==='프리랜서(3.3%)')tips.push(['warn','프리랜서(3.3% 원천징수)는 핵심 지원금의 <b>사각지대</b>입니다. 사업자등록이나 법인 설립을 검토할 때는 법적 장단점을 먼저 확인하세요.']);
  if(M.form==='예비창업자')tips.push(['','예비창업자는 사업자등록이 없는 것을 자격으로 정한 공고가 있습니다. 공고문에서 「사업자등록 없을 것」 문구를 먼저 확인하세요.']);
  if(M.hasBiz==='있음')tips.push(['warn','공고가 「공고일 현재 사업자등록 없을 것」을 요구하면 <b>매출이 없어도 등록을 보유한 것만으로 자격 미달</b>일 수 있습니다. 폐업신고 접수일과 처리일을 확인하세요.']);
  if(M.selfFund!==''&&Number(M.selfFund)===0)tips.push(['bad','자부담 가용 금액이 0원입니다. <b>자부담이 없는 트랙만 검색</b>하세요. 납부 능력을 가장해 자부담을 낸 것처럼 꾸미는 것은 사기가 될 수 있습니다.']);
  if(String(M.prior).trim())tips.push(['','수혜 이력은 사업계획서와 신청서에 <b>정확히 기재</b>하세요. 중복수혜 제한이 있는 공고에서 숨기고 신청하면 문제가 됩니다.']);
  return tips.length?tips.map(x=>`<div class="rem" style="${x[0]==='bad'?'background:var(--red-soft);border-color:var(--red)':x[0]==='warn'?'background:var(--amber-soft);border-color:var(--amber)':x[0]==='ok'?'background:var(--teal-soft);border-color:var(--teal)':''}">${x[1]}</div>`).join(''):'<p class="hint">위 항목을 입력하면 내 상황에 맞는 확인 포인트가 여기에 나타납니다.</p>'},
 feedstat(){if(!FEED)return'';const it=FEED.items||[],c=n=>it.filter(x=>x.deadline&&dday(x.deadline)>=0&&dday(x.deadline)<=n).length;
  const bad=(FEED.sources||[]).filter(x=>!x.ok),age=FEED.updatedAt?(Date.now()-new Date(FEED.updatedAt))/36e5:null;
  return`<div class="tiles"><div class="tile" style="background:var(--red-soft);color:var(--red)"><b>${c(7)}</b><span>🔥 7일 안 마감</span></div><div class="tile" style="background:var(--amber-soft);color:var(--amber)"><b>${c(14)}</b><span>⏰ 14일 안 마감</span></div><div class="tile" style="background:var(--pri-soft);color:var(--pri)"><b>${it.length}</b><span>📋 전체 공고</span></div></div>
  <p class="hint mt">마지막 수집 ${esc((FEED.updatedAt||'없음').replace('T',' ').slice(0,16))}</p>
  ${bad.length?`<p><span class="chip bad">수집 실패</span> ${bad.map(x=>esc(x.name)).join(', ')} <span class="hint">(이전 결과 유지 중)</span></p>`:''}${age!=null&&age>48?'<p><span class="chip bad">48시간 넘게 갱신되지 않았습니다</span></p>':''}`},
 feed(){if(FEEDERR)return`<p class="hint">${esc(FEEDERR)}</p>`;if(!FEED)return'<p class="hint">불러오는 중…</p>';
  const have=new Set(S.notices.map(n=>n.url)),q=FEEDQ.trim().toLowerCase(),t=new Date();t.setDate(t.getDate()-2);const ns=t.toISOString().slice(0,10);
  const list=(FEED.items||[]).filter(x=>!q||[x.title,x.program,x.sourceName].join(' ').toLowerCase().includes(q));
  return list.length?list.map(x=>`<div class="nc">${dd(x.deadline)}<div class="t">${x.firstSeen>=ns?'<span class="chip ok">🆕 신규</span>':''}<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><div class="hint">${esc(x.sourceName)}${x.program?' · '+esc(x.program):''}${x.deadline?' · 마감 '+esc(x.deadline.slice(5)):''}</div>
   <button class="btn sm mt" data-act="watch:${esc(x.id)}" ${have.has(x.url)?'disabled':''}>${have.has(x.url)?'⭐ 등록됨':'🤍 관심 등록'}</button></div></div>`).join(''):'<p class="hint">조건에 맞는 공고가 없습니다.</p>'}
};

function live(){
 document.querySelectorAll('[data-live]').forEach(el=>{const f=LIVE[el.dataset.live];if(f)el.innerHTML=f()});
 const P=progress(),soon=FEED?(FEED.items||[]).filter(x=>x.deadline&&dday(x.deadline)>=0&&dday(x.deadline)<=7).length:'-';
 $('#tiles').innerHTML=`<div class="tile"><b>${P.pct}%</b><span>🌱 학습 진도</span></div><div class="tile"><b>${S.notices.length}</b><span>⭐ 관심 공고</span></div><div class="tile"><b>${soon}</b><span>⏰ 7일 안 마감</span></div>`;
 checkBadges()}
function render(){
 $('#tabs').innerHTML=TABS.map(([id,ic,n])=>`<button role="tab" data-go="${id}" ${id===tab?'aria-current="page"':''}><span class="ic" aria-hidden="true">${ic}</span>${n}</button>`).join('');
 $('#main').innerHTML=F[tab]();if(POP)setTimeout(()=>{POP=''},900);live()}
function go(t){tab=t;history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)}

/* ===== 이벤트 ===== */
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-feedq]')){FEEDQ=el.value;live();return}
 const b=el.dataset&&el.dataset.bind;if(!b)return;
 setPath(S,b,el.type==='number'?(el.value===''?'':Number(el.value)):el.value);save();live()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&'rerender' in el.dataset)render();
 if(el.dataset&&el.dataset.done){if(el.checked)S.done[el.dataset.done]=true;else delete S.done[el.dataset.done];save();const y=scrollY;render();scrollTo(0,y)}
 if(el.dataset&&el.dataset.gcheck){if(el.checked)S.guide.checks[el.dataset.gcheck]=true;else delete S.guide.checks[el.dataset.gcheck];save();const y=scrollY;render();scrollTo(0,y)}
 if(el.id==='restore'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{S=merge(fresh(),JSON.parse(r.result));save();render();toast('복원했습니다')}catch(x){toast('백업 파일을 읽지 못했습니다')}};r.readAsText(el.files[0]);el.value=''}});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const el=e.target.closest('[data-act]');if(!el)return;const [a,arg]=el.dataset.act.split(':'),n=Number(arg);
 switch(a){
  case'addNotice':S.notices.push({title:'',agency:'',deadline:'',status:'검토',url:'',memo:''});save();render();break;
  case'delNotice':if(confirm('이 공고를 삭제할까요?')){S.notices.splice(n,1);save();render()}break;
  case'watch':{const x=(FEED&&FEED.items||[]).find(i=>i.id===arg);if(x&&!S.notices.some(n2=>n2.url===x.url)){S.notices.push({title:x.title,agency:x.sourceName,deadline:x.deadline||'',status:'검토',url:x.url,memo:x.program||''});save();render();toast('내 공고에 등록했습니다')}break}
  case'clearChecks':S.guide.checks={};save();render();break;
  case'install':if(DEFERRED){DEFERRED.prompt();DEFERRED.userChoice.finally(()=>{DEFERRED=null;render()})}break;
  case'dismissInstall':try{localStorage.setItem('edupang-install-dismissed','1')}catch(e){}render();break;
  case'backup':{const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a2.download=`edupang-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a2);a2.click();a2.remove();break}
  case'reset':if(confirm('모든 입력을 지웁니다. 계속할까요?')){S=fresh();save();render();toast('초기화했습니다')}break;
 }});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t!==tab&&TABS.some(x=>x[0]===t)){tab=t;render()}});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
