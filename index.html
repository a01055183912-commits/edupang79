<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

label{display:block;font-size:12.5px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:3px}

textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.del{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
.chip{display:inline-block;background:var(--chip);color:var(--pri);border-radius:99px;padding:1px 9px;font-size:12px;margin:1px 2px 1px 0}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}

.mod:last-child{border-bottom:0}
.mod input[type=number]{margin:0}
.mod .t small{display:block;color:var(--mute)}
.cour{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:8px;padding:12px;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:520px;overflow:auto}
.nt{display:grid;grid-template-columns:1fr 1fr 150px 130px;gap:8px}
.nt .w{grid-column:1/-1}
.iw{display:grid;grid-template-columns:1fr 1fr 1fr 110px;gap:8px}
.iw .w{grid-column:1/-1}

#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));z-index:6}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.mt{margin-top:10px}

 {id:'c3',name:'중급과정',title:'계획을 세우고 돈을 끌어온다',out:'사업계획서 · 마케팅 계획 · 지원사업 계획서 · 조직도 · 직무기술서 · 3년 자금계획',mods:[
  {id:'3-1',t:'사업계획 수립',h:4,est:1},{id:'3-2',t:'시장 분석과 마케팅',h:4,est:1},{id:'3-3',t:'지원사업 유치',h:4,est:1},
  {id:'3-4',t:'조직 설계',h:3,est:1},{id:'3-5',t:'시설·설비·자원',h:3,est:1},{id:'3-6',t:'세무 실무 2',h:3,est:1},{id:'3-7',t:'재원 확보 2',h:3,est:1}]},
 {id:'c4',name:'상급과정',title:'시스템으로 돌리고 키운다',out:'SOP · KPI · ERP · AI 계획 · 조달 점검표 · IR · 운영 매뉴얼 · 3년 로드맵',mods:[
  {id:'4-1',t:'경영 시스템 구축',h:4,est:1},{id:'4-2',t:'ERP와 데이터 경영',h:4,est:1},{id:'4-3',t:'AI와 로컬 LLM',h:4,est:1},
  {id:'4-4',t:'공공조달·입찰',h:3,est:1},{id:'4-5',t:'지배구조·리스크',h:3,est:1},{id:'4-6',t:'성장 전략·투자',h:3,est:1},{id:'4-7',t:'캡스톤',h:3,est:1}]}
];
const MODS=CATALOG.flatMap(c=>c.mods.map(m=>({...m,cid:c.id,cname:c.name})));
const STATUS=['검토','준비중','제출','선정','탈락','보류'];

const DEFAULT_TPL=`# {{사업명}} 운영 계획(안)

## 1. 사업 개요

- 교육 기간·장소: {{기간}} / {{장소}}
- 교육 규모: 총 {{총시간}}시간 · {{일수}}일 (하루 {{일일시간}}시간 기준)

/* ===== 상태 ===== */
const KEY='edupang-policy-v1';
const fresh=()=>({v:1,
 project:{name:'',agency:'',target:'',headcount:20,period:'',venue:'',hoursPerDay:8,background:'',effect:''},
 sel:{'1-1':true,'1-2':true,'1-3':true,'1-4':true},mh:{},
 price:{main:100000,assist:0,assistN:0,material:10000,ops:50000,mgmt:10,vat:false},
 extra:[],notices:[],tpl:null,
 company:{name:'에듀팡파트너즈',rep:'김미연',bizNo:'',openDate:'2024-10-22',bizType:'교육서비스업(기타 교육지원 서비스업) 외',address:'',phone:'',email:'',
  intro:'AI·디지털 활용, 진로·취업, 인문학·리더십, 조직 소통·경제, 법정의무 교육을 학교·기업·공공기관·복지 현장에 맞춰 설계하고 운영합니다. 기관 특성에 맞는 커리큘럼 설계를 강점으로 합니다.',
  record:'- 기업: 한화오션 AX 수용성 워크숍, 현대일렉트릭 AI 활용, 롯데 청년직무아카데미 LIFT, 배달의민족 배민아카데미, BTX모빌리티 Claude 활용 교육\n- 공공·대학: 구미전자정보기술원, 조선대학교, 경상북도 신전략 프로젝트 포럼, 부산시인재개발원, 광주시청, 울산남구청 일자리종합센터, 영도구청, 울산여성일자리\n- 진로·인문학·팀빌딩: 성균관대·동서대·대구대 모의면접, 국회도서관·부산시청·한국수력원자력 리더십 인문학, 현대미포조선·한진중공업 팀빌딩\n- 2026.11 여수 AI 창업 아이디어 해커톤 AI 활용 교육(90분)\n- 2026.9 과기정통부 소프트웨어 인재키움 바이브코딩 창업교육 Demo Day 심사'},
 instructors:[{name:'김미연',field:'AI·디지털 활용 · 진로·취업 · 인문학·리더십 · 조직 소통·경제 · 법정의무',modules:'',rate:0,
  note:'에듀팡파트너즈 대표',
  bio:'극동대학교 인공지능보안학과 박사 재학, 부경대학교 한국문화학과 석사. 한국미래AI협회 수석공인AI강사, 부산지역경제교육센터 경제강사. 부산광역시 「나는 강사다」 최우수상(부산광역시장상, 2024·2026). AI윤리전문가(AIEP), 창업교육전문가 1급, 경제교육지도사 1급, 산업교육강사 1급.'}]});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){return merge(fresh(),JSON.parse(r))}}catch(e){}return fresh()}
function merge(base,src){ // 알려진 키만 받아 들인다
 if(!src||typeof src!=='object')return base;
 for(const k of ['project','price']) if(src[k]&&typeof src[k]==='object') for(const f of Object.keys(base[k])) if(f in src[k]) base[k][f]=src[k][f];
 for(const k of ['sel','mh']) if(src[k]&&typeof src[k]==='object') base[k]=Object.fromEntries(Object.entries(src[k]).filter(([id])=>MODS.some(m=>m.id===id)));
 if(src.company&&typeof src.company==='object') for(const f of Object.keys(base.company)) if(typeof src.company[f]==='string') base.company[f]=src.company[f];
 for(const k of ['extra','instructors','notices']) if(Array.isArray(src[k])) base[k]=src[k].filter(x=>x&&typeof x==='object');
 if(typeof src.tpl==='string') base.tpl=src.tpl;
 return base}
let saveFail=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveFail){saveFail=true;toast('브라우저 저장이 막혀 있습니다. 「데이터」 탭에서 백업 파일을 받아 두세요.')}}}

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
function setPath(o,p,v){const k=p.split('.');if(k.some(x=>x==='__proto__'||x==='constructor'||x==='prototype'))return;let c=o;for(let i=0;i<k.length-1;i++){if(c[k[i]]==null||typeof c[k[i]]!=='object')c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=v}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('복사했습니다')}catch(e){toast('복사가 막혀 있습니다. 직접 선택해 복사하세요.')}}
const bind=(p,v,extra='')=>`data-bind="${esc(p)}" value="${esc(v)}" ${extra}`;

/* ===== 계산 ===== */
const mods=()=>MODS.map(m=>({...m,h:S.mh[m.id]!=null?num(S.mh[m.id]):m.h}));
const picked=()=>mods().filter(m=>S.sel[m.id]);
const totalH=()=>picked().reduce((a,m)=>a+m.h,0);
function parseIds(s){return String(Array.isArray(s)?s.join(' '):s||'').split(/[\s,;/]+/).filter(x=>MODS.some(m=>m.id===x))}
const assigned=()=>new Set(S.instructors.flatMap(i=>parseIds(i.modules)));
function plan(){const hpd=num(S.project.hoursPerDay)||8,days=[];let cur=null;
 for(const m of picked()){if(!cur||cur.h+m.h>hpd){cur={mods:[],h:0};days.push(cur)}cur.mods.push(m);cur.h+=m.h}return days}
function lecturerOf(id){return S.instructors.find(i=>parseIds(i.modules).includes(id))}
function budget(){
 const P=S.price,N=num(S.project.headcount),H=totalH(),D=plan().length;
 let main=0;for(const m of picked()){const i=lecturerOf(m.id);main+=m.h*(i&&num(i.rate)>0?num(i.rate):num(P.main))}
 const rows=[
  ['주강사료','단원별 배정 강사 단가 적용 (미배정·단가 미입력은 기본 단가 '+won(num(P.main))+')',main],
  ['보조강사료',`${H}시간 × ${num(P.assistN)}명 × ${won(num(P.assist))}`,H*num(P.assistN)*num(P.assist)],
  ['교재·자료비',`${N}명 × ${won(num(P.material))}`,N*num(P.material)],
  ['운영비(장소·다과 등)',`${D}일 × ${won(num(P.ops))}`,D*num(P.ops)],
  ...S.extra.map(e=>[e.name||'기타','직접 입력',num(e.amount)])];
 const direct=rows.reduce((a,r)=>a+r[2],0),mgmt=Math.round(direct*num(P.mgmt)/100),sub=direct+mgmt,vat=P.vat?Math.round(sub/10):0,total=sub+vat;

function tenure(){const d=new Date(S.company.openDate+'T00:00:00');if(isNaN(d))return'';const t=new Date();let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth();if(t.getDate()<d.getDate())m--;return m<0?'':`${Math.floor(m/12)}년 ${m%12}개월`}

  const age=FEED.updatedAt?(Date.now()-new Date(FEED.updatedAt))/36e5:null,have=new Set(S.notices.map(n=>n.url));
  const bad=(FEED.sources||[]).filter(x=>!x.ok),q=FEEDQ.trim().toLowerCase();
  const list=(FEED.items||[]).filter(x=>!q||[x.title,x.program,x.sourceName].join(' ').toLowerCase().includes(q));
  const t=new Date();t.setDate(t.getDate()-2);const newSince=t.toISOString().slice(0,10);
  return`<p class="hint">마지막 수집 ${esc((FEED.updatedAt||'없음').replace('T',' ').slice(0,16))} · ${(FEED.sources||[]).map(x=>`${esc(x.name)} ${x.count}건`).join(' · ')}</p>
  ${bad.length?`<p><span class="chip bad">수집 실패</span> ${bad.map(x=>esc(x.name)+': '+esc(x.error||'')).join(' / ')} <span class="hint">(이전 결과를 유지 중)</span></p>`:''}
  ${age!=null&&age>48?'<p><span class="chip bad">48시간 넘게 갱신되지 않았습니다</span></p>':''}
  ${list.length?`<table><thead><tr><th>마감</th><th>공고</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.deadline?esc(x.deadline.slice(5))+'<br>'+ddayChip(x.deadline):'미정'}</td>
  <td>${x.firstSeen>=newSince?'<span class="chip ok">신규</span>':''}<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><br><span class="hint">${esc(x.sourceName)}${x.program?' · '+esc(x.program):''}</span></td>
  <td><button class="btn sm" data-act="watch:${esc(x.id)}" ${have.has(x.url)?'disabled':''}>${have.has(x.url)?'등록됨':'관심 등록'}</button></td></tr>`).join('')}</tbody></table>`:'<p class="hint">조건에 맞는 공고가 없습니다.</p>'}`},
 doc(){return esc(renderDoc().text)},
 tenure(){return esc(tenure()||'-')},
 miss(){const m=renderDoc().miss;return m.length?`<p><span class="chip warn">입력 필요 ${m.length}</span> ${m.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</p>`:'<p><span class="chip ok">모든 변수가 채워졌습니다</span></p>'}
};
function live(){
 document.querySelectorAll('[data-live]').forEach(el=>{const f=LIVE[el.dataset.live];if(!f)return;const h=f();if(el.tagName==='PRE')el.innerHTML=h;else el.innerHTML=h});
 const B=budget(),un=picked().filter(m=>!assigned().has(m.id)).length;
 $('#sum').innerHTML=`<span>총 <b>${B.H}</b>시간 · <b>${B.D}</b>일</span><span>합계 <b>${won(B.total)}</b></span><span>1인당 <b>${won(B.perHead)}</b></span>${un&&B.H?`<span style="color:var(--warn)">강사 미배정 ${un}단원</span>`:''}`}
function render(){
 $('#tabs').innerHTML=TABS.map(([id,n])=>`<button role="tab" data-act="go:${id}" ${id===tab?'aria-current="page"':''}>${n}</button>`).join('');
 $('#main').innerHTML=F[tab]();live()}
function go(t){tab=t;history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)}

/* ===== 강사 가져오기 ===== */
function importInst(raw){
 raw=String(raw||'').trim();if(!raw)return toast('가져올 내용이 없습니다');
 let list=[];
 try{if(raw[0]==='['||raw[0]==='{'){const j=JSON.parse(raw);list=(Array.isArray(j)?j:[j]).filter(x=>x&&typeof x==='object').map(x=>({name:x.name||x['이름']||'',field:x.field||x['분야']||'',modules:x.modules||x['담당단원']||'',rate:num(x.rate||x['단가']),note:x.note||x['메모']||'',bio:x.bio||x['약력']||''}))}
 else list=raw.split(/\r?\n/).map(l=>l.split(/\t|,/).map(c=>c.trim())).filter(c=>c[0]&&c[0]!=='이름').map(c=>({name:c[0],field:c[1]||'',modules:c[2]||'',rate:num(String(c[3]||'').replace(/[^\d.]/g,'')),note:c.slice(4).join(', ')}))}
 catch(e){return toast('형식을 읽지 못했습니다. JSON 배열 또는 줄 단위 텍스트로 넣어 주세요.')}
 if(!list.length)return toast('가져올 강사가 없습니다');
 S.instructors.push(...list.map(i=>({...i,modules:parseIds(i.modules).join(', ')})));save();render();toast(`${list.length}명을 가져왔습니다`)}

/* ===== 이벤트 ===== */
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-feedq]')){FEEDQ=el.value;live();return}
 if(el.matches('[data-tpl]')){S.tpl=el.value;save();live();return}
 const b=el.dataset&&el.dataset.bind;if(!b)return;
 const v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?0:num(el.value)):el.value;
 if(el.type==='checkbox'&&b.startsWith('sel.')){const id=b.slice(4);if(v)S.sel[id]=true;else delete S.sel[id]}else setPath(S,b,v);
 save();live()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&'rerender' in el.dataset)render();
 if(el.id==='impFile'&&el.files[0]){const r=new FileReader();r.onload=()=>importInst(r.result);r.readAsText(el.files[0]);el.value=''}
 if(el.id==='restore'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);S=merge(fresh(),j);save();render();toast('복원했습니다')}catch(x){toast('백업 파일을 읽지 못했습니다')}};r.readAsText(el.files[0]);el.value=''}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
 const [a,arg]=el.dataset.act.split(':'),n=Number(arg);
 switch(a){
  case'go':go(arg);break;
  case'all':case'none':MODS.filter(m=>m.cid===arg).forEach(m=>{if(a==='all')S.sel[m.id]=true;else delete S.sel[m.id]});save();render();break;
  case'addInst':S.instructors.push({name:'',field:'',modules:'',rate:0,note:''});save();render();break;
  case'delInst':S.instructors.splice(n,1);save();render();break;
  case'impInst':importInst($('#impTxt').value);break;
  case'addExtra':S.extra.push({name:'',amount:0});save();render();break;
  case'delExtra':S.extra.splice(n,1);save();render();break;
  case'watch':{const x=(FEED&&FEED.items||[]).find(i=>i.id===arg);if(x&&!S.notices.some(n=>n.url===x.url)){S.notices.push({title:x.title,agency:x.sourceName,deadline:x.deadline||'',status:'검토',url:x.url,memo:x.program||''});save();render();toast('내 공고에 등록했습니다')}break}
  case'addNotice':S.notices.push({title:'',agency:'',deadline:'',status:'검토',url:'',memo:''});save();render();break;
  case'delNotice':if(confirm('이 공고를 삭제할까요?')){S.notices.splice(n,1);save();render()}break;
  case'mkProject':{const x=S.notices[n];if(x){S.project.name=x.title||S.project.name;S.project.agency=x.agency||S.project.agency;save();go('project');toast('공고 정보를 사업 설정에 넣었습니다')}break}
  case'copyDoc':copy(renderDoc().text);break;
  case'dlDoc':download(`정책사업_제안서_${(S.project.name||'초안').replace(/[\\/:*?"<>|\s]+/g,'_')}.md`,renderDoc().text,'text/markdown');break;
  case'resetTpl':S.tpl=null;save();render();break;
  case'backup':download(`edupang-policy-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,2),'application/json');break;
  case'reset':if(confirm('모든 입력을 지웁니다. 계속할까요?')){S=fresh();save();render();toast('초기화했습니다')}break;
 }});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t!==tab&&TABS.some(x=>x[0]===t)){tab=t;render()}});
render();
</script>
</body>
</html>
