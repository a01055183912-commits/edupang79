name: collect-notices
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-notices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 공고 수집 $(date -u +%F)"
          # 그 사이 main이 앞서갔으면 최신 main 위에 얹어 다시 시도한다 (충돌 시 방금 수집한 결과를 우선)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
