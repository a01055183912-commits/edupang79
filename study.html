<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d3df0">
<title>정부지원금 사후관리 학습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero" style="background:linear-gradient(135deg,#6d3df0 0%,#2563eb 100%)"><div class="wrap">
  <h1>⚖️ 정부지원금, 받은 뒤 지키는 법</h1>
  <p>변호사 강의 교안(120분, 52장)을 공부용으로 정리했습니다. 레슨 → 퀴즈 → 판별 연습 → 암기 순서로 공부하세요. <a href="index.html">← 학습·준비 도구</a></p>
  <div class="tiles" id="tiles"></div>
</div></header>
<nav class="tabs" aria-label="메뉴"><div class="in" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="study-data.js"></script>
<script src="pack.js"></script>
<script>
'use strict';
/* ============ 상태·유틸 ============ */
const KEY='edupang-study-v1';
let P={done:{},best:null,wrong:[],last:null};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object')P={...P,...r}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const TABS=[['guide','🧭','길잡이'],['lesson','📖','레슨'],['quiz','✏️','퀴즈'],['notice','📮','통보서'],['ten','🔟','10계명'],['case','🏛️','판례'],['gloss','📕','용어'],['ask','💬','Claude']];
let tab=(location.hash||'#guide').slice(1);if(!TABS.some(t=>t[0]===tab))tab='guide';
Pack.onMsg=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(Pack._t);Pack._t=setTimeout(()=>t.classList.remove('on'),2800)};
let Q=null; // 진행 중 퀴즈
let N7={};  // 통보서 판별 선택

/* ============ 화면 ============ */
function table(t){
 if(t.title==='첫 7일 대응 로드맵')return`<h3>⏱️ ${esc(t.title)}</h3><div class="tl">${t.rows.map(r=>`<div class="p"><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}</div>`;
 if(t.title==='4+2 트랙')return`<h3>🧩 ${esc(t.title)}</h3><div class="tiles2">${t.rows.map((r,i)=>`<div class="tk c${i}"><b>${esc(r[0])} ${esc(r[1])}</b><small>내 돈: ${esc(r[2])}</small><small>리스크: ${esc(r[3])}</small></div>`).join('')}</div>`;
 return`${t.title?`<h3>${esc(t.title)}</h3>`:''}<div class="tw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const V={
guide(){const n=LESSONS.filter(l=>P.done[l.id]).length,pct=Math.round(n/LESSONS.length*100);
 return`<div class="card"><h2>이 자료로 공부하는 법</h2>
 <p style="margin:6px 0">교안 52장의 내용을 <b>레슨 → 퀴즈 → 판별 연습 → 암기</b> 순서로 공부할 수 있게 나눴습니다. 이 페이지만으로 교안의 모든 핵심(구조, 사례, 체크리스트, Q&A, 판례)을 볼 수 있습니다.</p>
 <ol><li><b>레슨</b> 탭에서 M1~M8과 추가 모듈 A~C를 순서대로 읽고 「학습 완료」를 체크합니다. (약 90분)</li>
 <li>모듈을 마칠 때마다 <b>퀴즈</b>로 확인합니다. 틀린 문제는 모아서 다시 풉니다.</li>
 <li><b>통보서 판별</b>로 통보서를 받았을 때의 7문항 점검을 연습합니다.</li>
 <li><b>10계명·금지</b> 카드를 가리고 떠올려 봅니다. <b>판례</b>·<b>용어</b>는 필요할 때 찾아봅니다.</li></ol>
 <div class="row" style="margin-top:10px"><button class="btn pri" data-go="lesson">레슨 시작</button><button class="btn" data-go="quiz">퀴즈 풀기</button></div></div>
 <div class="card"><h2>내 진도</h2><div class="bar" aria-label="레슨 진도"><i style="width:${pct}%"></i></div>
 <p class="hint" style="margin:6px 0 0">레슨 ${n}/${LESSONS.length} 완료${P.best!=null?` · 퀴즈 최고 ${P.best}점`:''}${P.wrong.length?` · 다시 볼 문제 ${P.wrong.length}개`:''}</p></div>
 <div class="card"><h2>한눈에 보는 핵심 5줄</h2><ul>
 <li>협약은 계약이고, 지침은 그 계약서의 본문입니다. 협약이 끝나도 책임은 끝나지 않습니다.</li>
 <li>제재의 크기는 잘못 쓴 금액에 비례하지 않습니다. 고의 유용은 사업비 전액 환수와 참여제한 5년입니다.</li>
 <li>우회하지 말고 서면으로 질의하고, 변경은 사전 승인 후 합니다.</li>
 <li>공고문·협약서·그 연도의 지침 원본 PDF를 끝까지 보관합니다.</li>
 <li>통보서를 받으면 반박문보다 먼저 「이 통보가 무엇인지」 성격을 규정합니다.</li></ul></div>
 <div class="card"><h2>출처와 유의사항</h2>
 <p class="warn-box" style="margin:0">출처: 「정부지원금, 받는 것보다 ‘지키는 것’이 더 어렵습니다」 강의 교안(52장). 이 페이지는 교안을 공부용으로 재구성한 것이며, 판결 번호와 내용은 교안 표기를 그대로 옮겼고 원문 판결을 확인하지 않았습니다. 교안 내 표기가 서로 다른 곳(예: 8장 「2022구합100822」와 다른 장의 「2021구합100822」)은 해당 레슨에 표시했습니다. 법적 판단이 필요한 상황에서는 변호사 등 전문가와 상담하세요.</p></div>`},
lesson(){return LESSONS.map(l=>`<details class="les" id="les-${l.id}"><summary><span>${esc(l.title)}</span><span class="chip">슬라이드 ${l.slides}</span>${P.done[l.id]?'<span class="chip ok">완료</span>':''}</summary><div class="body">
 <p style="margin:6px 0"><b>${esc(l.summary)}</b></p>
 ${l.points?`<ul>${l.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
 ${(l.tables||[]).map(table).join('')}
 ${l.cases?`<h3>관련 판례</h3><ul>${l.cases.map(c=>`<li><b>${esc(c[0])}</b>: ${esc(c[1])}</li>`).join('')}</ul>`:''}
 ${l.qa?l.qa.map(q=>`<details class="qa"><summary>${esc(q[0])}</summary><p style="margin:6px 0">${esc(q[1])}</p></details>`).join(''):''}
 <div class="rem"><b>기억할 것</b> · ${esc(l.remember)}</div>
 <label class="row" style="cursor:pointer"><input type="checkbox" data-done="${l.id}" ${P.done[l.id]?'checked':''}> 이 레슨을 학습했습니다</label>
 <div class="row" style="margin-top:8px"><button class="btn sm" data-quizm="${l.id}">이 모듈 퀴즈 풀기</button></div></div></details>`).join('')},
quiz(){
 if(!Q){const mods=[...new Set(QUIZ.map(q=>q.m))];
  return`<div class="card"><h2>퀴즈 (${QUIZ.length}문항)</h2><p class="hint">모든 문항은 교안 내용에서 출제했고, 정답과 함께 근거 슬라이드를 보여 줍니다.</p>
  <label class="hint">범위<select id="qm"><option value="ALL">전체 (${QUIZ.length}문항)</option>${mods.map(m=>`<option value="${m}">${esc(LESSONS.find(l=>l.id===m).title.split(' · ')[0])} (${QUIZ.filter(q=>q.m===m).length}문항)</option>`).join('')}</select></label>
  <div class="row" style="margin-top:10px"><button class="btn pri" data-qstart="1">시작</button>${P.wrong.length?`<button class="btn" data-qstart="wrong">틀린 문제만 다시 (${P.wrong.length})</button>`:''}</div>
  ${P.last?`<p class="hint" style="margin-top:10px">지난 결과: ${P.last.s}/${P.last.n} · 최고 ${P.best}점(100점 만점)</p>`:''}</div>`}
 if(Q.i>=Q.list.length){const pct=Math.round(Q.ok/Q.list.length*100);
  return`<div class="card"><h2>결과</h2><p style="font-size:20px;margin:6px 0"><b>${Q.ok} / ${Q.list.length}</b> (${pct}점)</p>
  <p class="hint">${pct>=80?'잘하셨습니다. 틀린 문제는 해당 레슨을 다시 읽어 보세요.':'레슨을 다시 읽고 틀린 문제만 다시 풀어 보세요.'}</p>
  ${Q.bad.length?`<h3>틀린 문제</h3><ul>${Q.bad.map(q=>`<li>${esc(q.q)} <span class="chip">${esc(q.r)}</span></li>`).join('')}</ul>`:''}
  <div class="row"><button class="btn pri" data-qstart="1">다시 풀기</button><button class="btn" data-qreset="1">범위 다시 고르기</button></div></div>`}
 const q=Q.list[Q.i];
 return`<div class="card"><div class="row" style="justify-content:space-between"><span class="chip">${Q.i+1} / ${Q.list.length}</span><span class="hint">맞힌 개수 ${Q.ok}</span></div>
 <h2 style="margin-top:8px">${esc(q.q)}</h2>
 ${q.o.map((o,k)=>{let c='opt';if(Q.picked!=null){if(k===q.a)c+=' right';else if(k===Q.picked)c+=' wrong'}return`<button class="${c}" data-pick="${k}" ${Q.picked!=null?'disabled':''}>${'①②③④'[k]} ${esc(o)}</button>`}).join('')}
 ${Q.picked!=null?`<div class="rem" role="status"><b>${Q.picked===q.a?'정답입니다.':'오답입니다.'}</b> ${esc(q.e)} <span class="chip">${esc(q.r)}</span></div><button class="btn pri" data-qnext="1">${Q.i+1<Q.list.length?'다음 문제':'결과 보기'}</button>`:''}</div>`},
notice(){
 const lean={p:0,c:0},picked=NOTICE7.map((it,i)=>N7[i]!=null?it.o[N7[i]]:null);picked.forEach(o=>{if(o&&(o[2]==='p'||o[2]==='c'))lean[o[2]]++});
 const done=picked.filter(Boolean).length;
 return`<div class="card"><h2>통보서 성격 판별 7문항</h2><p class="hint">통보서를 받은 즉시 아래 7가지를 확인합니다. 이 결과가 소송 종류와 피고 선택을 좌우합니다. 각 항목에서 내 통보서에 해당하는 것을 고르면, 교안이 설명하는 시사점이 나타납니다.</p>
 ${NOTICE7.map((it,i)=>`<div class="fc sel"><b>${esc(it.q)}</b>${it.o.map((o,k)=>`<label><input type="radio" name="n${i}" data-n="${i}:${k}" ${N7[i]===k?'checked':''}> <span>${esc(o[0])}${N7[i]===k?`<br><span class="chip ${o[2]==='p'?'warn':o[2]==='c'?'':'ok'}">시사점</span> ${esc(o[1])}`:''}</span></label>`).join('')}</div>`).join('')}
 <div class="rem"><b>종합 (참고용)</b> · ${done}/7 항목 선택<div class="meter" aria-hidden="true"><i class="p" style="width:${(lean.p+lean.c)?lean.p/(lean.p+lean.c)*100:0}%"></i><i class="c" style="width:${(lean.p+lean.c)?lean.c/(lean.p+lean.c)*100:0}%"></i></div><span class="chip warn">처분 쪽 신호 ${lean.p}개</span><span class="chip">계약상 의사표시 쪽 신호 ${lean.c}개</span><p class="hint" style="margin:6px 0 0">이 합계는 학습용 정리일 뿐 법적 결론이 아닙니다. 실제 통보서는 반드시 전문가와 함께 확인하세요.</p></div>
 <div class="row"><button class="btn sm" data-nreset="1">선택 지우기</button></div></div>
 <div class="card"><h2>이어서 기억할 것</h2><ul><li>통보서를 받은 날: 통보서·봉투·수령일 증거 보존, 사내 자료 삭제 절대 금지</li><li>이 통보가 처분이면 항고소송(처분청 피고, 제소기간 제한), 공법상 계약상 의사표시이면 당사자소송(귀속주체 피고, 행정법원 전속관할)</li><li>공고연도와 협약 체결일이 적용 법령을 결정하고, 그것이 소송의 종류를 결정</li></ul></div>`},
ten(){return`<div class="card"><h2>정부지원금 10계명</h2><p class="hint">계명만 보고 이유와 근거 사례를 떠올려 본 뒤 「답 보기」를 누르세요.</p>
 ${TEN.map((t,i)=>`<div class="fc"><span class="n">${i+1}</span><b>${esc(t[0])}</b><div class="hide" id="t${i}"><p style="margin:6px 0">${esc(t[1])}</p><span class="chip">${esc(t[2])}</span></div><div><button class="btn sm" data-show="t${i}">답 보기</button></div></div>`).join('')}
 <button class="btn" data-showall="1">모두 보기/숨기기</button></div>
 <div class="card"><h2>절대 하지 말 것 6가지</h2><p class="hint">행위를 보고 실제 결과를 떠올려 보세요.</p>
 ${SIX.map((s,i)=>`<div class="fc"><span class="n">${'①②③④⑤⑥'[i]}</span><b>${esc(s[0])}</b><div class="hide" id="s${i}"><p style="margin:6px 0">→ ${esc(s[1])}</p></div><div><button class="btn sm" data-show="s${i}">결과 보기</button></div></div>`).join('')}</div>`},
case(){return`<div class="card"><h2>판례 색인 (${CASES.length}건)</h2><p class="hint">교안에 나온 판결을 한곳에 모았습니다. 교안 표기를 그대로 옮긴 것이며 원문 판결은 확인하지 않았습니다.</p>
 <input type="search" id="cq" placeholder="사건번호·키워드 (예: 페이백, 각하, 참여제한)" aria-label="판례 검색"><div id="clist" class="tw" style="margin-top:10px"></div></div>`},
ask(){return Pack.cardHtml({withMe:false})},
gloss(){return`<div class="card"><h2>📕 용어집</h2><input type="search" id="gq" placeholder="용어 검색" aria-label="용어 검색"><div id="glist" style="margin-top:10px"></div></div>`}
};
function renderCases(){const q=($('#cq')?.value||'').trim();const list=CASES.filter(c=>!q||c.join(' ').includes(q));
 $('#clist').innerHTML=list.length?`<table><thead><tr><th>사건</th><th>내용</th><th>슬라이드</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}</td><td>${esc(c[2])}</td></tr>`).join('')}</tbody></table>`:'<p class="hint">검색 결과가 없습니다.</p>'}
function renderGloss(){const q=($('#gq')?.value||'').trim();const list=GLOSS.filter(g=>!q||g.join(' ').includes(q));
 $('#glist').innerHTML=list.length?list.map(g=>`<div class="fc"><b>${esc(g[0])}</b><p style="margin:4px 0 0">${esc(g[1])}</p></div>`).join(''):'<p class="hint">검색 결과가 없습니다.</p>'}
function render(){
 $('#tabs').innerHTML=TABS.map(([id,ic,n])=>`<button role="tab" data-go="${id}" ${id===tab?'aria-current="page"':''}><span class="ic" aria-hidden="true">${ic}</span>${n}</button>`).join('');
 const nd=LESSONS.filter(l=>P.done[l.id]).length;$('#tiles').innerHTML=`<div class="tile"><b>${nd}/${LESSONS.length}</b><span>레슨 완료</span></div><div class="tile"><b>${P.best!=null?P.best:'-'}</b><span>퀴즈 최고점</span></div><div class="tile"><b>${P.wrong.length}</b><span>다시 볼 문제</span></div>`;
 $('#main').innerHTML=V[tab]();if(tab==='case')renderCases();if(tab==='gloss')renderGloss()}
function go(t){tab=t;history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)}
function startQuiz(mode){
 const sel=$('#qm')?.value||(Q&&Q.scope)||'ALL';let pool=mode==='wrong'?QUIZ.filter((q,i)=>P.wrong.includes(i)):QUIZ.filter(q=>sel==='ALL'||q.m===sel);
 pool=pool.map(q=>{const ord=q.o.map((_,k)=>k).sort(()=>Math.random()-.5);return{...q,idx:QUIZ.indexOf(q),o:ord.map(k=>q.o[k]),a:ord.indexOf(q.a)}}).sort(()=>Math.random()-.5);
 if(!pool.length)return;Q={list:pool,i:0,ok:0,picked:null,bad:[],scope:sel};render()}
function finishQuiz(){const n=Q.list.length,s=Q.ok,pct=Math.round(s/n*100);
 const wrongNow=new Set(P.wrong);Q.list.forEach(q=>{if(Q.bad.includes(q))wrongNow.add(q.idx);else wrongNow.delete(q.idx)});
 P.wrong=[...wrongNow];P.last={s,n};if(Q.scope==='ALL'&&n===QUIZ.length&&(P.best==null||pct>P.best))P.best=pct;save()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go)go(d.go);
 else if(d.quizm){Q=null;tab='quiz';render();$('#qm').value=d.quizm;startQuiz()}
 else if(d.qstart)startQuiz(d.qstart==='wrong'?'wrong':'');
 else if(d.qreset){Q=null;render()}
 else if(d.pick!=null&&Q&&Q.picked==null){const k=+d.pick,q=Q.list[Q.i];Q.picked=k;if(k===q.a)Q.ok++;else Q.bad.push(q);render()}
 else if(d.qnext){Q.i++;Q.picked=null;if(Q.i>=Q.list.length)finishQuiz();render()}
 else if(d.show){document.getElementById(d.show).classList.toggle('hide')}
 else if(d.showall){const all=[...document.querySelectorAll('.fc .hide, .fc [id^="t"],.fc [id^="s"]')];const ids=[...document.querySelectorAll('[id^="t"].hide,[id^="s"].hide')];const any=ids.length>0;document.querySelectorAll('div[id^="t"],div[id^="s"]').forEach(x=>x.classList.toggle('hide',!any))}
 else if(d.nreset){N7={};render()}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.done){if(el.checked)P.done[el.dataset.done]=true;else delete P.done[el.dataset.done];save();const open=[...document.querySelectorAll('details.les[open]')].map(x=>x.id);render();open.forEach(id=>{const x=document.getElementById(id);if(x)x.open=true})}
 else if(el.dataset.n){const[i,k]=el.dataset.n.split(':').map(Number);N7[i]=k;const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('input',e=>{if(e.target.id==='cq')renderCases();if(e.target.id==='gq')renderGloss()});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t!==tab&&TABS.some(x=>x[0]===t)){tab=t;render()}});
render();
</script>
</body>
</html>
