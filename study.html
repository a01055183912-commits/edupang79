<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2330;--mute:#667085;--line:#e2e6ed;--pri:#1f5fd6;--pri-ink:#fff;--chip:#e9f0fd;--ok:#157347;--warn:#a15c07;--bad:#b42318;--soft:#f0f2f6;--okbg:#e8f5ee;--badbg:#fdecea}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:40px}

nav button{flex:none;border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}

main{max-width:960px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--chip);color:var(--pri);border-radius:99px;padding:1px 9px;font-size:12px;margin:1px 2px 1px 0}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}

th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12.5px}
.tw{overflow-x:auto}.tw table{min-width:520px}
details.les{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.les>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.les>summary::-webkit-details-marker{display:none}
details.les>summary::before{content:"▸";color:var(--mute)}details.les[open]>summary::before{content:"▾"}
details.les .body{padding:0 16px 14px}
.rem{background:var(--soft);border-left:4px solid var(--pri);border-radius:6px;padding:8px 12px;margin:10px 0}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}

.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.qa{border-top:1px solid var(--line);padding:6px 0}.qa summary{cursor:pointer;font-weight:600}
.fc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card)}
.fc .n{color:var(--pri);font-weight:700;margin-right:6px}
.hide{display:none}
.sel label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.warn-box{border:1px solid var(--warn);border-radius:8px;padding:8px 12px;color:var(--ink);background:transparent;font-size:13.5px}
</style>
</head>

{id:'M5',title:'M5 · 계약서 작성법: 사고의 90%는 집행 단계에서 난다',slides:'19~25',

 points:['고용계약서(근로계약서)는 「인건비 3중」: 근로계약서 + 급여대장·이체 + 산출물·업무일지.',

  '외주 용역은 5종 증빙 세트: ① 3자 견적서 ② 계약서 ③ 산출물 원본 ④ 검수확인서 ⑤ 대금 이체 내역. 산출물이 없는 용역비는 사실상 방어가 불가능합니다.',
  '사업비 집행 사전승인 대장에 「특수관계 여부」와 「지침 근거 조항」을 적게 만들면 위험한 거래는 대부분 그 칸에서 멈춥니다.',
  '협약 내용을 바꿀 때는 전담기관의 통보·승인을 받고 변경합니다. 임의 변경은 그 자체가 해약·환수·참여제한 사유입니다.',

{id:'M6',title:'M6 · 불복의 기술: 통보서의 성격부터 규정한다',slides:'26~31',

 points:['「각하」는 졌다는 뜻이 아니라, 내용을 볼 자격이 없다고 문 앞에서 돌려보내진 것입니다.',
  '통보서가 처분(공권력 행사)이면 항고소송, 공법상 계약상 의사표시이면 공법상 당사자소송입니다. 피고와 특징이 다릅니다.',
  '첫 7일: 증거 보존과 7문항 판별 → 원본 확보 → 집행 내역 정리 → 사실 확인 → 이의신청서(자료 대조표 중심) → 형사 리스크 병행 검토.',
  '행정에서 한 말과 형사에서 한 말이 다르면 둘 다 잃습니다. 형사 약식명령 확정 사실이 행정 사건의 근거로 쓰였습니다.',
  '내용이 잘못이어도 절차와 계산이 틀리면 취소받을 수 있습니다. 참여제한의 시작일과 종료일을 문서로 확인합니다.',
  '현행 중소기업창업 지원법 제63조: 참여제한(7년 범위)·환수 권한 명문화, 통지 의무 신설, 강제징수 권한 신설(2023. 9. 14.). 종전 판례가 처분성을 부정한 핵심 근거가 채워졌습니다. 공고연도와 협약 체결일이 적용 법령을 결정하고, 그것이 소송의 종류를 결정합니다.'],

{id:'M7',title:'M7 · 예방 시스템: 사건들의 공통점 5가지',slides:'32~34',
 summary:'판례를 관통하는 공통 원인 5가지를 알면, 정부지원금 10계명이 외워집니다.',
 points:['① 비목이 안 맞는데 일은 급했다 — 프리랜서와 계약이 불가능한데 앱 개발이 급해 인건비로 우회(서울행정법원 2022구합89340)',
  '② 협약 전에 이미 돈을 썼다 — 기간 전 개발비를 받으려 계약서 날짜를 맞춤(대전지방법원 2021구합100822)',
  '③ 아는 사람과 거래했다 — 인적·물적 구분이 곤란한 기업 간 현금거래(서울행정법원 2022구합79190)',
  '④ 기관이 승인했으니 괜찮다고 믿었다 — 시스템 등록·지급 승인만으로는 신뢰보호가 인정되지 않음(서울행정법원 2022구합79190)',
  '⑤ 내부에서 터졌다 — 임금 민원·직원 제보가 조사 착수 계기(대전지방법원 2021구합103906)',

{id:'M8',title:'M8 · Q&A 15문',slides:'35~37',
 summary:'자격·신청, 집행, 종료·정산, 불복·형사 단계에서 자주 나오는 질문 15개와 모범 답변입니다. 먼저 질문을 읽고 스스로 답해 본 뒤 펼쳐 보세요.',
 qa:[
  ['Q1. 사업자등록만 있고 매출이 0원인데, 예비창업자 사업에 지원 가능한가요?','공고문 문구에 따라 갈립니다. 「사업자등록이 없을 것」을 자격으로 정하면 매출이 없어도 등록 보유 자체로 자격 미달입니다(대구고등법원 2024누11106). 공고문 문구를 먼저 확정하세요.'],
  ['Q2. 폐업신고를 했는데 처리 전에 공고일이 지났습니다.','쟁점은 공고일 현재 등록이 소멸했는지입니다. 폐업신고 접수일·처리일과 사업자등록 상태를 증명서로 확보하고, 애매하면 접수 전에 주관기관에 서면 질의하세요.'],
  ['Q3. 기관이 서류를 검토하고 선정했으면 자격은 인정된 것 아닌가요?','그 주장은 배척되었습니다. 공고에 요건이 명시된 이상 공적 견해 표명으로 볼 수 없고, 공고를 확인하지 못한 것은 지원자의 귀책사유입니다(대구지방법원 2024구합20842).'],
  ['Q4. 지침상 프리랜서와 계약이 안 됩니다. 방법이 없나요?','우회는 답이 아닙니다. ① 사업자등록 있는 업체와 외주용역계약 ② 직접 고용 ③ 비목 변경 승인 요청 순으로 검토합니다.'],
  ['Q5. 돈이 실제로 다 사업에 들어갔습니다. 그래도 유용인가요?','예, 유용에 해당할 수 있습니다. 인건비를 다른 용도로 쓰면 개인적 용도 여부와 무관하게 유용입니다(서울행정법원 2022구합89340).'],
  ['Q6. 되돌려 받은 금액이 400만 원인데 왜 5,000만 원 전액을 환수당하나요?','지침이 「고의 유용」에 대해 전액 환수를 정하고 있고, 유용금액 비중이 작다는 사정만으로 비례원칙 위반이 아니라고 판단됩니다.'],
  ['Q7. 배우자·형제 업체가 전문입니다. 시장가로 계약하면 되나요?','권하지 않습니다. 특수관계인 거래는 더 엄격하게 평가되고, 시스템 등록도 신뢰보호 근거로 인정되지 않았습니다(서울행정법원 2022구합79190).'],
  ['Q8. 협약 전에 이미 개발을 시작했습니다. 그 비용은 어떻게 하나요?','사업비로 처리할 수 없습니다. 자기자금으로 처리하세요. 허위 용역계약서 작성은 형사·행정 모두 제재 대상입니다.'],
  ['Q9. 지침 내용을 설명받지 못했습니다. 무효 아닌가요?','그 주장은 배척되었습니다. 확약을 한 이상 설명의무 대상 중요 약관으로 보기 어렵다고 판단되었습니다(서울고등법원 2024누34599).'],
  ['Q10. 목표를 못 채웠습니다. 바로 환수인가요?','목표 미달 자체보다 불성실 수행 여부가 관건입니다. 재시도·외부자문·방법 변경 기록이 핵심 지표입니다(서울행정법원 2018구합86559).'],
  ['Q11. 주관기관은 잘했다고 했는데 전담기관이 문제를 지적합니다.','중간 평가 결과만 믿고 안심할 수 없습니다. 최종 정산은 전담기관 차원에서 진행됩니다.'],
  ['Q12. 정산금 납부 독촉장을 받았습니다. 취소소송을 내면 되나요?','처분성이 부정되어 각하된 사례가 있습니다. ① 통보 명의자 ② 근거 ③ 돈이 최종 귀속되는 주체를 먼저 확정하세요(서울행정법원 2023구합54969).'],
  ['Q13. 이의신청을 하는 것이 실익이 있습니까?','있습니다. 참여제한 3년·14억 환수가 참여제한 2년 6개월·6억 5천만 원으로 감경된 사례가 있습니다(서울행정법원 2023구합57920).'],
  ['Q14. 소송에서 이길 수 있는 유형은 무엇입니까?','① 통보 주체 권한 없어 무효 확인(부산고등법원 2020누23513) ② 적용 지침 연도에 제한 규정이 없어 반환채무 부존재 확인(서울행정법원 2023구합53515) ③ 참여제한 기간 계산 오인으로 취소(서울고등법원 2023누35670)'],
  ['Q15. 형사와 행정, 어느 쪽을 먼저 대응해야 합니까?','분리하지 말고 일관성을 최우선으로 합니다. 형사 유죄 확정 사실이 행정 사건의 근거로 그대로 사용되었습니다(대전지방법원 2021구합100822).']],
 remember:'Q&A의 공통 답: 공고문 문구·지침 연도를 먼저 확정하고, 우회하지 말고 서면으로, 형사와 행정은 일관되게.'},
{id:'A',title:'추가 모듈 A · 지원금 찾는 법: 6개 트랙 깊이 보기',slides:'38~46',
 summary:'순서를 바꿉니다. ① 나는 지금 ①~⑥ 트랙 중 무엇이 필요한가 → ② 그 트랙에서 자격을 갖춘 카테고리는 무엇인가 → ③ 그 카테고리의 공고문을 찾는다. 이 순서를 지키면 검색량이 10분의 1로 줄어듭니다.',
 points:['현물 트랙을 먼저 권하는 이유: 돈이 없는 단계에서 현금보다 먼저 확보할 것은 공간·장비·자문이고, 자부담이 없거나 낮으며 환수 위험이 상대적으로 낮습니다. 경로: 창업보육센터, 1인 창조기업 지원센터, 지자체 창업센터.',
  '출연·보조 트랙: 전담기관 → 주관기관 → (예비)창업자의 3단 구조. 공고문 → 운영지침 → 협약서가 하나의 사슬이며 끝에 환수와 참여제한이 있습니다. 공고문에 「명시되지 않은 사항은 운영지침에 따른다」가 있으면 운영지침 전체가 계약 내용입니다.',
  '융자 트랙(중진공 정책자금 3층): 청년전용창업자금(만 39세 이하 + 업력 3년 미만) / 창업기반지원자금(업력 7년 미만 또는 창업하는 자) / 혁신창업사업화자금(기술력·사업성 우수, 자금 부족). 업력의 기산점은 「사업개시일」, 종점은 「신청서 제출일」입니다. 신청을 미루면 업력이 늘어 탈락할 수 있으니 공고문을 먼저 확정한 뒤 등록 타이밍을 정합니다.',
  '보증 트랙: 「무자본에 가장 가깝지만, 가장 위험한 길」. 실제로는 내 신용을 담보로 시작하는 방법입니다. 미변제 시 대위변제 후 구상권으로 대표자에게 청구됩니다. 회생을 해도 지역신보 연대보증은 함께 줄지 않을 수 있고(대법원 2019다226135), 신용회복위원회 채무조정이 실무적 출구가 될 수 있습니다(대법원 2021다293831).',
  '투자·보육 트랙: 창업기획자(액셀러레이터)는 사업모델·기술·시설·초기사업비 투자와 컨설팅·교육 연계 의무가 있습니다(벤처투자 촉진에 관한 법률 제25조). 「선정을 도와주겠다며 돈·지분을 요구하는 제안」은 범죄의 입구입니다(알선수재 기소: 서울북부지방법원 2016고합180).',
  '벤처확인·세제 트랙: 창업기업 확인(중소벤처기업부장관) / 벤처기업 확인(벤처기업확인기관의 장) / 사회적기업 인증(고용노동부장관)·소셜벤처 판별(기술보증기금 등 판별기관)을 구분합니다. 순서는 지원사업 선정 → 요건 충족 시 벤처확인. 처음부터 인증 수집에 시간을 쓸 필요는 없습니다.',
  '세제 실익: 창업벤처중소기업이 창업일부터 4년 이내 사업용 재산을 취득하면 취득세 75% 감면(수원고등법원 2019누13134). 예비벤처기업확인 후 취득·등기하고 실제 벤처확인을 받은 경우도 취득세·등록세 면제 대상이나(대법원 2009두14040), 폐업하지 않고 실제로 확인받는 것이 전제입니다.',
  '소셜벤처 판별 요건: ① 사회적 가치가 구체적이고 실현 가능할 것 ② 기술의 혁신성과 시장 전망 등 성장성이 충분할 것.'],
 remember:'트랙(돈의 성격) → 카테고리(내 자격) → 공고문. 현물 트랙이 출발점입니다.'},
{id:'B',title:'추가 모듈 B · 합법 트랙의 함정',slides:'47~49',
 summary:'합법적인 트랙 안에도 형사 사건으로 이어지는 함정이 있습니다.',
 points:['함정 1 — 자부담금 가장: 납부 능력이 없는데 지인에게 빌려 납부하고 지원금 수령 후 돌려주는 것 자체가 사기의 기망행위입니다(제주지방법원 2018고단216, 광주지방법원 순천지원 2024고단2311). 올바른 선택은 자부담 없는 트랙을 고르거나 실제로 마련한 뒤 신청하는 것뿐입니다.',
  '함정 2 — 페이퍼컴퍼니·허위 임대차계약서: 사업장이 없는데 허위 임대차계약서로 사업자등록 후 기술보증기금 보증서로 대출(수원지방법원 안양지원 2023고단1233, 부산지방법원 2016고단384). 기보는 현장조사를 합니다.',
  '함정 3 — 사업 의사 없이 다수 중복 수급: 창업 의사·능력 없이 계획서를 제출해 수령 후 개인 사용(대구지방법원 2022고합413), 여러 사업에 동시·순차 신청해 중복 수령(수원지방법원 2023고단5357). 중복수혜 자체가 무조건 금지는 아니며, 공고문에 제한이 있는데 숨기고 신청하는 것이 문제입니다.',
  '함정 4 — 부정수급 시 별개 지원금까지 환수되는가: 대법원 2015두50580은 보조금법 반환명령 대상이 「거짓 신청 등 부정한 방법으로 교부받은 보조금」에 한정되고 정상 교부된 별개 보조금은 포함되지 않는다고 봤습니다. 다만 이는 보조금관리법 사안이며, 협약에 전액 환수 조항이 있는 공법상 계약 사안에서는 다른 논리가 적용될 수 있습니다.'],
 remember:'자부담은 실제로 마련하고, 사업장은 실제로 두고, 수혜 이력은 정확히 쓴다.'},
{id:'C',title:'추가 모듈 C · 특수 상황별 경로와 부록',slides:'50~52',
 summary:'잊히기 쉬운 종잣돈 경로 3가지와, 배포용 요약 「절대 하지 말 것 6가지」입니다.',
 points:['군 전역 예정자 — 장병내일준비적금(병역법 시행령 제158조의2): 국가가 재정지원금을 지급합니다. 전역 후 업력 0일 상태로 예비창업자 지원사업에 신청할 자격 조건도 갖춥니다.',
  '보훈대상자 — 사업대부(국가유공자 등 예우 및 지원에 관한 법률 시행규칙 제12조): 일반 정책자금보다 금리와 조건이 유리한 경우가 있어 국가보훈부 제도를 먼저 확인합니다.',
  '한부모가족 — 자산형성 지원(한부모가족지원법 제17조의4): 지자체별 창업 연계 프로그램은 거주 지역 건강가정·다문화가족지원센터에 문의합니다.',
  '마무리 메시지: 정부지원금은 사업을 키우는 좋은 도구입니다. 다만 그 돈에는 끝나도 끝나지 않는 꼬리표가 붙습니다.'],

  ['④ 협약기간 전 비용을 위한 허위 계약서','전액 환수·참여제한 5년 + 약식명령 확정(대전지방법원 2021구합100822)'],
  ['⑤ 특수관계·인적물적 구분 곤란 업체와 거래','환수·제재 유지(서울행정법원 2022구합79190)'],
  ['⑥ 승인 없이 협약 내용 변경','해약·환수·참여제한 2년(서울행정법원 2024구합51240)']]}],

function finishQuiz(){const n=Q.list.length,s=Q.ok,pct=Math.round(s/n*100);

 P.wrong=[...wrongNow];P.last={s,n};if(Q.scope==='ALL'&&n===QUIZ.length&&(P.best==null||pct>P.best))P.best=pct;save()}
